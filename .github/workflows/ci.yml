name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt would reformat:"
            echo "$out"
            exit 1
          fi

      - name: Test
        run: go test ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jansvca:ci
          load: true

      - name: Inspect image size
        run: docker image inspect jansvca:ci --format 'size={{.Size}}'

      - name: Smoke test (binary starts and listens)
        run: |
          docker run --rm -d --name jansvca-smoke -p 18080:8081 -e JANSVCA_ADDR=:8081 jansvca:ci
          sleep 3
          docker logs jansvca-smoke
          curl -fsS -o /dev/null http://127.0.0.1:18080/api/projects || docker logs jansvca-smoke
          docker stop jansvca-smoke
